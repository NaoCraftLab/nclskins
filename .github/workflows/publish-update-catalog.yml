name: Publish update catalog

on:
  workflow_call:
    inputs:
      catalog_source_commit:
        description: Pinned current-main commit containing the public target catalog
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-update-catalog
  cancel-in-progress: false

jobs:
  pages:
    name: Generate and deploy update catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out pinned catalog source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.catalog_source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          validate-wrappers: true

      - name: Generate deterministic Pages artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NCLSKINS_CATALOG_WORKFLOW: 'true'
          SOURCE_COMMIT: ${{ inputs.catalog_source_commit || github.sha }}
          CALLER_CATALOG_COMMIT: ${{ inputs.catalog_source_commit }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: ./gradlew generateUpdateCatalog -PupdateCatalogOutput=build/update-catalog/site --no-daemon

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/update-catalog/site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify deployed endpoint bytes
        shell: bash
        run: ./gradlew verifyUpdateCatalogDeployment -PupdateCatalogOutput=build/update-catalog/site --no-daemon
