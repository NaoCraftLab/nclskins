name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing exact SemVer release
        required: true
        type: string
      mode:
        description: Exact-tag reconcile or current-main mod-only compatibility backfill
        required: true
        default: reconcile-tag
        type: choice
        options:
          - reconcile-tag
          - compatibility-backfill

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  backfill-assets:
    name: Fetch existing GitHub Release assets
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download existing release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]
          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          asset_count="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_VERSION}" --jq '.assets | length')"
          [[ "$asset_count" -gt 0 ]] || {
            echo '::error title=Backfill release has no assets::An existing release with production JARs is required.'
            exit 1
          }
          mkdir existing-release-assets
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir existing-release-assets

      - name: Upload existing assets for the build job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nclskins-existing-${{ inputs.version }}
          path: existing-release-assets
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  build:
    name: Validate, test, and assemble
    needs: backfill-assets
    if: >-
      always() &&
      (github.event_name == 'push' || needs.backfill-assets.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      mode: ${{ steps.release.outputs.mode }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      source_commit: ${{ steps.release.outputs.source_commit }}
    steps:
      - name: Check out release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          TAG_VERSION: ${{ github.ref_name }}
          BACKFILL_VERSION: ${{ inputs.version }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$EVENT_REF" == 'refs/heads/main' ]] || {
              echo '::error title=Invalid backfill source::Manual release backfill must be dispatched from main.'
              exit 1
            }
            version="$BACKFILL_VERSION"
            if [[ "$REQUESTED_MODE" == 'reconcile-tag' ]]; then
              git rev-parse --verify "refs/tags/${version}^{commit}" >/dev/null
              git checkout --detach "refs/tags/${version}"
              tagged_commit="$(git rev-parse HEAD)"
              git merge-base --is-ancestor "$tagged_commit" origin/main || {
                echo '::error title=Release tag is not on main::The reconciled tag must be reachable from origin/main.'
                exit 1
              }
              mode='reconcile-tag'
            elif [[ "$REQUESTED_MODE" == 'compatibility-backfill' ]]; then
              [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
                echo '::error title=Stale backfill source::Compatibility backfill must run from current origin/main.'
                exit 1
              }
              configured="$(sed -n 's/^modVersion=//p' gradle/version.properties)"
              [[ "$configured" == "$version" ]] || {
                echo '::error title=Historical current-main build forbidden::Use reconcile-tag for a version other than current modVersion.'
                exit 1
              }
              mode='backfill'
            else
              echo '::error title=Invalid manual release mode::Choose reconcile-tag or compatibility-backfill.'
              exit 1
            fi
          else
            version="$TAG_VERSION"
            mode='tag'
            tagged_commit="$(git rev-parse "${version}^{commit}")"
            git merge-base --is-ancestor "$tagged_commit" origin/main || {
              echo '::error title=Release tag is not on main::The tagged commit must be reachable from origin/main.'
              exit 1
            }
          fi

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]] || {
            echo '::error title=Invalid release version::Expected X.Y.Z, X.Y.Z-beta.N, or X.Y.Z-alpha.N.'
            exit 1
          }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'source_commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        id: java25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up JDK 21
        id: java21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up JDK 17
        id: java17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          validate-wrappers: true

      - name: Validate release contract
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_MODE: ${{ steps.source.outputs.mode }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: |
          set -euo pipefail
          ./gradlew validateRelease -PreleaseTag="$RELEASE_VERSION"
          metadata="build/release/${RELEASE_VERSION}/release-metadata.json"
          server_state="build/release/${RELEASE_VERSION}/server-plugin-release-state.json"
          printf 'NCLSKINS_SERVER_PLUGIN_BASELINE=%s\n' \
            "$(jq -er '.activeVersion' "$server_state")" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'mode=%s\n' "$RELEASE_MODE" >> "$GITHUB_OUTPUT"
          printf 'source_commit=%s\n' "$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'prerelease=%s\n' "$(jq -er '.prerelease' "$metadata")" >> "$GITHUB_OUTPUT"

      - name: Download existing GitHub assets for backfill
        if: steps.release.outputs.mode == 'backfill' || steps.release.outputs.mode == 'reconcile-tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nclskins-existing-${{ steps.release.outputs.version }}
          path: existing-release-assets

      - name: Require the immutable backfill tag
        if: steps.release.outputs.mode == 'backfill' || steps.release.outputs.mode == 'reconcile-tag'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/${RELEASE_VERSION}^{commit}" >/dev/null

      - name: Run full release gate and assemble bundle
        shell: bash
        env:
          NCLSKINS_BUILD_JOBS: '3'
          NCLSKINS_JAVA17: ${{ steps.java17.outputs.path }}
          NCLSKINS_JAVA21: ${{ steps.java21.outputs.path }}
          NCLSKINS_JAVA25: ${{ steps.java25.outputs.path }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
        run: |
          set -euo pipefail
          args=(assembleRelease -PreleaseTag="$RELEASE_VERSION" -PreleaseMode="$RELEASE_MODE")
          if [[ "$RELEASE_MODE" == 'backfill' || "$RELEASE_MODE" == 'reconcile-tag' ]]; then
            args+=(-PexistingReleaseAssets=existing-release-assets)
          fi
          ./gradlew "${args[@]}"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nclskins-release-${{ steps.release.outputs.version }}
          path: build/release/${{ steps.release.outputs.version }}
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  platforms:
    name: Publish Modrinth and CurseForge
    needs: build
    if: >-
      always() &&
      !cancelled() &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out publisher build logic
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          validate-wrappers: true

      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nclskins-release-${{ needs.build.outputs.version }}
          path: release-bundle

      - name: Preflight and publish missing platform versions
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_UPLOAD_TOKEN: ${{ secrets.CURSEFORGE_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          ./gradlew publishReleasePlatforms -PreleaseBundle=release-bundle --no-daemon

  github:
    name: Publish GitHub Release
    needs: [build, platforms]
    if: >-
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.platforms.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out publisher build logic
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          validate-wrappers: true

      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nclskins-release-${{ needs.build.outputs.version }}
          path: release-bundle

      - name: Reconcile GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./gradlew publishGithubRelease -PreleaseBundle=release-bundle --no-daemon
