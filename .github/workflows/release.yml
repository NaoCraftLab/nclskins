name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version to create or extend
        required: true
        type: string
      resume_run:
        description: Resume verified bundle from this Release workflow run (90 days)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan and preflight before builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source: ${{ steps.plan.outputs.source }}
      catalog: ${{ steps.plan.outputs.catalog }}
      matrix: ${{ steps.plan.outputs.matrix }}
      build: ${{ steps.plan.outputs.build }}
      resumed: ${{ steps.plan.outputs.resumed }}
      baseline: ${{ steps.plan.outputs.baseline }}
      digest: ${{ steps.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve pinned plan or verified resume bundle
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_UPLOAD_TOKEN: ${{ secrets.CURSEFORGE_UPLOAD_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          RESUME_RUN: ${{ inputs.resume_run }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EVENT_REF" == refs/heads/main ]]
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          printf 'catalog=%s\n' "$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          if [[ -n "$RESUME_RUN" ]]; then
            [[ "$RESUME_RUN" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN" > source-run.json
            [[ "$(jq -r '.path' source-run.json)" == '.github/workflows/release.yml' ]]
            [[ "$(jq -r '.repository.full_name' source-run.json)" == "$GITHUB_REPOSITORY" ]]
            [[ "$(jq -r '.event' source-run.json)" =~ ^(push|workflow_dispatch)$ ]]
            gh run download "$RESUME_RUN" --repo "$GITHUB_REPOSITORY" -n "release-bundle-$VERSION" -D release-bundle
            [[ "$(jq -r '.version' release-bundle/release-manifest.json)" == "$VERSION" ]]
            [[ "$(jq -r '.releasePlanDigest' release-bundle/release-manifest.json)" =~ ^[0-9a-f]{64}$ ]]
            [[ -f release-bundle/release-plan.json ]]
            source="$(jq -r '.sourceCommit' release-bundle/release-manifest.json)"
            [[ "$source" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$source" origin/main
            printf 'source=%s\nresumed=true\nbuild=false\nmatrix={"include":[]}\n' "$source" >> "$GITHUB_OUTPUT"
          else
            ./gradlew planRelease -PreleaseTag="$VERSION" --no-daemon --console=plain
            plan=build/release-plan/release-plan.json
            printf 'digest=%s\n' "$(jq -r '.digest' "$plan")" >> "$GITHUB_OUTPUT"
            source="$(jq -r '.sourceCommit' "$plan")"
            matrix="$(jq -c '{include: [.components[] | select(.build) | {id: .id}]}' "$plan")"
            printf 'source=%s\nresumed=false\nmatrix=%s\nbuild=%s\nbaseline=%s\n' \
              "$source" "$matrix" "$(jq '.include | length > 0' <<< "$matrix")" \
              "$(jq -r '.serverState.activeVersion' "$plan")" >> "$GITHUB_OUTPUT"
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.resumed != 'true'
        with:
          name: release-plan-${{ steps.plan.outputs.version }}
          overwrite: true
          path: build/release-plan
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.resumed == 'true'
        with:
          name: release-bundle-${{ steps.plan.outputs.version }}
          overwrite: true
          path: release-bundle
          retention-days: 90
          if-no-files-found: error

  checks:
    name: Shared release checks
    needs: plan
    if: needs.plan.outputs.resumed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew checkRelease --no-daemon --console=plain

  components:
    name: Build ${{ matrix.id }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        id: java25
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plan-${{ needs.plan.outputs.version }}
          path: build/release-plan
      - name: Build and verify selected component
        env:
          COMPONENT_ID: ${{ matrix.id }}
          NCLSKINS_JAVA17: ${{ steps.java17.outputs.path }}
          NCLSKINS_JAVA21: ${{ steps.java21.outputs.path }}
          NCLSKINS_JAVA25: ${{ steps.java25.outputs.path }}
          NCLSKINS_SERVER_PLUGIN_BASELINE: ${{ needs.plan.outputs.baseline }}
        run: ./gradlew exportReleaseComponent -PtargetId="$COMPONENT_ID" --no-daemon --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-${{ needs.plan.outputs.digest }}-${{ matrix.id }}
          overwrite: true
          path: build/release-component
          retention-days: 90
          if-no-files-found: error

  bundle:
    name: Verify and assemble bundle
    needs: [plan, checks, components]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.resumed != 'true' && needs.checks.result == 'success' &&
      (needs.components.result == 'success' || needs.components.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plan-${{ needs.plan.outputs.version }}
          path: build/release-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.build == 'true'
        with:
          pattern: component-${{ needs.plan.outputs.digest }}-*
          merge-multiple: true
          path: build/release-plan/assets
      - run: ./gradlew assembleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ needs.plan.outputs.version }}
          path: build/release/${{ needs.plan.outputs.version }}
          overwrite: true
          retention-days: 90
          if-no-files-found: error

  publish:
    name: Preflight and publish missing files
    needs: [plan, bundle]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.bundle.result == 'success' || needs.plan.outputs.resumed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ needs.plan.outputs.version }}
          path: release-bundle
      - name: Final preflight without writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: ./gradlew preflightGithubRelease preflightReleasePlatforms -PreleaseBundle=release-bundle --no-daemon
      - name: Publish missing marketplace files
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_UPLOAD_TOKEN: ${{ secrets.CURSEFORGE_UPLOAD_TOKEN }}
        run: ./gradlew publishReleasePlatforms -PreleaseBundle=release-bundle --no-daemon
      - name: Add missing GitHub production JARs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew publishGithubRelease -PreleaseBundle=release-bundle --no-daemon

  update-catalog:
    name: Publish static update catalog
    needs: [plan, publish]
    if: needs.publish.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-update-catalog.yml
    with:
      catalog_source_commit: ${{ needs.plan.outputs.catalog }}
