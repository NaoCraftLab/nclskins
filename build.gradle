targetCatalog.serverPluginTopologies.each { Map topology ->
    String taskName = ServerPluginRuntimeSupport.taskName(topology)
    tasks.register(taskName, ServerPluginRunTask) {
        group = 'application'
        description = "Runs managed NCL Skins Plugin topology ${topology.id} (${topology.mode})."
        dependsOn tasks.named('buildServerPlugin')
        repositoryDirectory.set(layout.projectDirectory)
        delegate.catalogFile.set(layout.projectDirectory.file('gradle/targets.json'))
        pluginArtifact.set(layout.projectDirectory.file(
                "server-plugin/build/libs/nclskins-server-${modVersion}.jar"))
        topologyId.set(topology.id.toString())
        dryRun.set(serverRunDryRun)
        developmentLogging.set(devLogging)
    }
    String resetName = "reset${taskName.substring(3)}Runtime"
    tasks.register(resetName, ResetServerPluginRuntimeTask) {
        group = 'application'
        description = "Moves mutable state for ${topology.id} to recoverable .trash."
        repositoryDirectory.set(layout.projectDirectory)
        delegate.catalogFile.set(layout.projectDirectory.file('gradle/targets.json'))
        topologyId.set(topology.id.toString())
    }
}

targetCatalog.targets.each { Map target ->
    IdeaRunConfigurations.RUN_KINDS.each { String runKind ->
        tasks.register(IdeaRunConfigurations.taskName(target, runKind), TargetRunTask) {
            group = 'application'
            def runLabel = runKind == 'LicensedClient' ? 'licensed client' : runKind.toLowerCase()
            description = "Runs the ${target.id} ${runLabel} with its catalog wrapper and JDK."
            repositoryDirectory.set(layout.projectDirectory)
            delegate.catalogFile.set(layout.projectDirectory.file('gradle/targets.json'))
            targetId.set(target.id.toString())
            delegate.runKind.set(runKind)
            dryRun.set(runDryRun)
            developmentLogging.set(devLogging)
            usesService(targetRunLock)
        }
    }
}

def configureTargetBuild = { TargetBuildTask task, List<String> ids, List<String> targetTasks, boolean verify, boolean collect ->
    task.repositoryDirectory.set(layout.projectDirectory)
    task.catalogFile.set(layout.projectDirectory.file('gradle/targets.json'))
    task.targetIds.set(ids)
    task.targetTasks.set(targetTasks)
    task.maximumWorkers.set(buildWorkers)
    task.verifyArtifacts.set(verify)
    task.collectArtifacts.set(collect)
    task.verifyCompatibility.set(false)
}

targetCatalog.targets.findAll { it.compatibility instanceof Map }.each { Map target ->
    String loader = IdeaRunConfigurations.LOADERS[target.loader.id.toString()]
    String baseline = target.minecraft.version.toString().replaceAll('[^A-Za-z0-9]', '')
    def compatibilityBuild = tasks.register(
            "buildCompatibilityRun${loader}${baseline}", TargetBuildTask) {
        group = 'build setup'
        description = "Builds ${target.id} once for its exact-version development runs."
        configureTargetBuild(delegate, [target.id.toString()], ['build'], true, false)
    }
    nclskinsCatalogTools.targetRuntimeSpecs(target).findAll { !it.baseline }.each { Map runtime ->
        IdeaRunConfigurations.RUN_KINDS.each { String runKind ->
            tasks.register(IdeaRunConfigurations.taskName(
                    target, runtime.minecraftVersion.toString(), runKind), CompatibilityRunTask) {
                group = 'application'
                description = "Runs the ${target.id} production JAR on exact Minecraft " +
                        "${runtime.minecraftVersion} (${runKind})."
                dependsOn compatibilityBuild
                repositoryDirectory.set(layout.projectDirectory)
                delegate.catalogFile.set(layout.projectDirectory.file('gradle/targets.json'))
                targetId.set(target.id.toString())
                minecraftVersion.set(runtime.minecraftVersion.toString())
                delegate.runKind.set(runKind)
                dryRun.set(runDryRun)
                developmentLogging.set(devLogging)
                usesService(targetRunLock)
            }
        }
    }
}

tasks.register('buildTarget', TargetBuildTask) {
    group = 'build'
    description = 'Clean-builds and collects one catalog target.'
    doFirst {
        if (requestedTargetId == null || !targetIds.contains(requestedTargetId)) {
            throw new GradleException("Use -PtargetId=<catalog target>; available=${targetIds.sort()}")
        }
    }
    configureTargetBuild(delegate, requestedTargetId == null ? [] : [requestedTargetId], ['clean', 'build'], true, true)
}

tasks.register('buildAllTargets', TargetBuildTask) {
    group = 'build'
    description = 'Clean-builds and collects every catalog target.'
    configureTargetBuild(delegate, targetIds, ['clean', 'build'], true, true)
}

