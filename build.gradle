plugins {
    id 'com.naocraftlab.skins.build-tools'
}


import com.naocraftlab.skins.buildlogic.*

import java.nio.charset.StandardCharsets
import java.nio.file.AtomicMoveNotSupportedException
import java.nio.file.Files
import java.nio.file.StandardCopyOption

def catalogFile = file('gradle/targets.json')
def versionFile = file('gradle/version.properties')
def abiFile = file('gradle/abi-fingerprints.json')
def coverageFile = file('gradle/capability-semantic-coverage.json')
def targetCatalog = nclskinsCatalogTools.loadCatalog(rootDir.toPath())
def modVersion = nclskinsCatalogTools.loadVersion(versionFile.toPath())
def serverPluginBuildJdk = targetCatalog.serverPlugin.packaging.buildJdk as int
extensions.extraProperties.set('nclskinsTargetCatalog', targetCatalog)
def requestedNewVersion = providers.gradleProperty('newVersion').orNull
def targetIds = targetCatalog.targets.collect { it.id.toString() }
def requestedTargetId = providers.gradleProperty('targetId').orNull
def requestedMinecraftVersion = providers.gradleProperty('mcVersion').orNull
def requestedCapabilityKey = providers.gradleProperty('capabilityKey').orNull
def requestedReleaseTag = providers.gradleProperty('releaseTag').orNull
def requestedReleaseMode = providers.gradleProperty('releaseMode').getOrElse('tag')
def requestedExistingReleaseAssets = providers.gradleProperty('existingReleaseAssets').orNull
def requestedReleaseBundle = providers.gradleProperty('releaseBundle').orNull
def requestedFromRef = providers.gradleProperty('fromRef').orNull
def requestedToRef = providers.gradleProperty('toRef').orNull
def workerText = providers.environmentVariable('NCLSKINS_BUILD_JOBS').getOrElse('3')
if (!(workerText ==~ /[1-9][0-9]*/)) {
    throw new GradleException("NCLSKINS_BUILD_JOBS must be a positive integer, got ${workerText}")
}
def buildWorkers = workerText.toInteger()
def runDryRunText = providers.gradleProperty('nclskinsRunDryRun').getOrElse('false')
if (!(runDryRunText in ['true', 'false'])) {
    throw new GradleException("nclskinsRunDryRun must be true or false, got ${runDryRunText}")
}
def runDryRun = runDryRunText.toBoolean()
def devLoggingText = providers.gradleProperty('nclskinsDevLogging').getOrElse('false')
if (!(devLoggingText in ['true', 'false'])) {
    throw new GradleException("nclskinsDevLogging must be true or false, got ${devLoggingText}")
}
def devLogging = devLoggingText.toBoolean()
def serverRunDryRunText = providers.gradleProperty('nclskinsServerRunDryRun').getOrElse('false')
if (!(serverRunDryRunText in ['true', 'false'])) {
    throw new GradleException("nclskinsServerRunDryRun must be true or false, got ${serverRunDryRunText}")
}
def serverRunDryRun = serverRunDryRunText.toBoolean()
def targetRunLock = gradle.sharedServices.registerIfAbsent('nclskinsTargetRunLock', TargetRunLock) {
    maxParallelUsages.set(1)
}

allprojects {
    group = targetCatalog.mod.group
    version = modVersion
    repositories {
        mavenCentral()
    }
}

tasks.register('setVersion') {
    group = 'release setup'
    description = 'Sets the tracked NCL Skins development version.'
    doLast {
        if (requestedNewVersion == null || !(requestedNewVersion ==~ nclskinsCatalogTools.VERSION_PATTERN)) {
            throw new GradleException('Use -PnewVersion=<major.minor.patch[-alpha.N|-beta.N]> with strict SemVer')
        }
        if (requestedNewVersion == modVersion) {
            logger.lifecycle("NCL Skins version is already ${requestedNewVersion}")
            return
        }
        def temporary = versionFile.toPath().resolveSibling('version.properties.tmp')
        Files.writeString(temporary, "modVersion=${requestedNewVersion}\n", StandardCharsets.UTF_8)
        try {
            Files.move(temporary, versionFile.toPath(), StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
        } catch (AtomicMoveNotSupportedException ignored) {
            Files.move(temporary, versionFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
        logger.lifecycle("NCL Skins version changed from ${modVersion} to ${requestedNewVersion}")
    }
}

subprojects {
    apply plugin: 'java-library'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(
                    project.name in [
                            'server-configuration', 'server-contract', 'server-runtime',
                            'server-vanilla-publication', 'server-plugin-common',
                            'server-plugin-bukkit', 'server-plugin-velocity',
                            'server-plugin-bungee', 'server-plugin', 'diagnostics'
                    ] ? serverPluginBuildJdk : 17)
        }
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
        options.compilerArgs += ['-Xlint:all', '-Werror']
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'failed', 'skipped'
            exceptionFormat = 'full'
        }
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) {
            into 'META-INF'
        }
        from(rootProject.file('NOTICE')) {
            into 'META-INF'
        }
    }
}

