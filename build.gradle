def compatibilityTargetIds = targetCatalog.targets
        .findAll { it.compatibility instanceof Map }
        .collect { it.id.toString() }

def buildCompatibilityTarget = tasks.register('buildCompatibilityTarget', TargetBuildTask) {
    group = 'verification'
    description = 'Builds the compile-baseline production JAR for a compatibility-family target.'
    doFirst {
        if (requestedTargetId == null || !compatibilityTargetIds.contains(requestedTargetId)) {
            throw new GradleException(
                    "Use -PtargetId=<compatibility target>; available=${compatibilityTargetIds.sort()}")
        }
    }
    configureTargetBuild(
            delegate,
            requestedTargetId == null ? [] : [requestedTargetId],
            ['clean', 'build'],
            true,
            false)
}

tasks.register('verifyRuntimeCompatibility', CompatibilityVerifyTask) {
    group = 'verification'
    description = 'Resolves every declared patch runtime against one unchanged production JAR.'
    dependsOn buildCompatibilityTarget
    repositoryDirectory.set(layout.projectDirectory)
    delegate.catalogFile.set(layout.projectDirectory.file('gradle/targets.json'))
    targetId.set(requestedTargetId ?: '')
}

['Client', 'LicensedClient', 'Server'].each { String runKind ->
    tasks.register("runCompatibility${runKind}", CompatibilityRunTask) {
        group = 'application'
        description = "Runs one production JAR in an isolated declared compatibility ${runKind.toLowerCase()}."
        dependsOn buildCompatibilityTarget
        doFirst {
            if (requestedMinecraftVersion == null) {
                throw new GradleException('Use -PmcVersion=<declared compatibility Minecraft version>')
            }
        }
        repositoryDirectory.set(layout.projectDirectory)
        delegate.catalogFile.set(layout.projectDirectory.file('gradle/targets.json'))
        targetId.set(requestedTargetId ?: '')
        minecraftVersion.set(requestedMinecraftVersion ?: '')
        delegate.runKind.set(runKind)
        dryRun.set(runDryRun)
        developmentLogging.set(devLogging)
        usesService(targetRunLock)
    }
}

def checkAll = tasks.register('checkAll') {
    group = 'verification'
    description = 'Runs the platform-independent verification suite.'
    dependsOn subprojects.collect { it.tasks.named('check') }
    dependsOn verifyTargetCatalog
    dependsOn verifyCapabilitySemantics
    dependsOn verifyPublicationTree
    dependsOn tasks.named('verifyLoggingConventions')
    dependsOn tasks.named('verifyLoggingSecurityBaseline')
    dependsOn gradle.includedBuild('build-logic').task(':test')
}

def fullCheck = tasks.register('fullCheck', TargetBuildTask) {
    group = 'verification'
    description = 'Runs common checks, every target build, artifact verification, and repository secret checks.'
    dependsOn checkAll
    configureTargetBuild(delegate, targetIds, ['clean', 'build'], true, false)
    verifyCompatibility.set(true)
}

def computeServerPluginReleaseState = tasks.register(
        'computeServerPluginReleaseState', ComputeServerPluginReleaseStateTask) {
    group = 'release setup'
    description = 'Computes the sealed automatic server plugin publication decision.'
    repositoryDirectory.set(layout.projectDirectory)
    delegate.catalogFile.set(layout.projectDirectory.file('gradle/targets.json'))
    releaseTag.set(requestedReleaseTag ?: modVersion)
    stateFile.set(layout.buildDirectory.file(
            "release/${requestedReleaseTag ?: modVersion}/server-plugin-release-state.json"))
    outputs.upToDateWhen { false }
}

def validateRelease = tasks.register('validateRelease', ValidateReleaseTask) {
    group = 'release setup'
    description = 'Validates a release tag, configured version, and matching changelog section.'
    dependsOn computeServerPluginReleaseState
    repositoryDirectory.set(layout.projectDirectory)
    delegate.catalogFile.set(layout.projectDirectory.file('gradle/targets.json'))
    delegate.versionFile.set(layout.projectDirectory.file('gradle/version.properties'))
    changelogFile.set(layout.projectDirectory.file('CHANGELOG.md'))
    serverChangelogFile.set(layout.projectDirectory.file('SERVER_CHANGELOG.md'))
    serverPluginStateFile.set(computeServerPluginReleaseState.flatMap { it.stateFile })
    releaseTag.set(requestedReleaseTag ?: '')
    releaseRoot.set(layout.buildDirectory.dir('release'))
    outputs.upToDateWhen { false }
}

tasks.register('assembleRelease', AssembleReleaseTask) {
    group = 'release'
    description = 'Runs the full gate and assembles a tag or backfill publication bundle.'
    dependsOn validateRelease
    dependsOn fullCheck
    dependsOn tasks.named('buildServerPlugin')
    repositoryDirectory.set(layout.projectDirectory)
    delegate.catalogFile.set(layout.projectDirectory.file('gradle/targets.json'))
    delegate.versionFile.set(layout.projectDirectory.file('gradle/version.properties'))
    changelogFile.set(layout.projectDirectory.file('CHANGELOG.md'))
    serverChangelogFile.set(layout.projectDirectory.file('SERVER_CHANGELOG.md'))
    serverPluginStateFile.set(computeServerPluginReleaseState.flatMap { it.stateFile })
    releaseTag.set(requestedReleaseTag ?: '')
    releaseMode.set(requestedReleaseMode)
    if (requestedExistingReleaseAssets != null) {
        existingAssetsDirectory.set(layout.projectDirectory.dir(requestedExistingReleaseAssets))
    }
    releaseRoot.set(layout.buildDirectory.dir('release'))
    outputs.upToDateWhen { false }
}

tasks.register('publishReleasePlatforms', PublishPlatformsTask) {
    group = 'release'
    description = 'Preflights Modrinth and CurseForge and uploads only missing exact target versions.'
    doFirst {
        if (requestedReleaseBundle == null) {
            throw new GradleException('Use -PreleaseBundle=<verified release bundle directory>')
        }
    }
    if (requestedReleaseBundle != null) {
        bundleDirectory.set(layout.projectDirectory.dir(requestedReleaseBundle))
    } else {
        bundleDirectory.set(layout.buildDirectory.dir('missing-release-bundle'))
    }
}

tasks.register('publishGithubRelease', PublishGithubReleaseTask) {
    group = 'release'
    description = 'Creates or reconciles the GitHub Release from a verified release bundle.'
    doFirst {
        if (requestedReleaseBundle == null) {
            throw new GradleException('Use -PreleaseBundle=<verified release bundle directory>')
        }
    }
    if (requestedReleaseBundle != null) {
        bundleDirectory.set(layout.projectDirectory.dir(requestedReleaseBundle))
    } else {
        bundleDirectory.set(layout.buildDirectory.dir('missing-release-bundle'))
    }
}
