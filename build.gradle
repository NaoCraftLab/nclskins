tasks.register('verifyLoggingConventions') {
    group = 'verification'
    description = 'Enforces the bounded diagnostics contract across production Java sources.'
    def productionSources = fileTree(rootDir) {
        include '**/src/main/java/**/*.java'
        exclude '**/build/**', '.gradle/**', 'runs/**', 'do' + 'cs/**'
    }
    def repositoryPath = rootDir.toPath()
    inputs.files(productionSources)
    doLast {
        List<String> errors = []
        productionSources.files.sort().each { File source ->
            String relative = repositoryPath.relativize(source.toPath()).toString()
            String text = source.getText('UTF-8')
            if (text.contains('System.Logger') || text.contains('System.getLogger(') ||
                    text.contains('System.out') || text.contains('System.err') ||
                    text.contains('.printStackTrace(')) {
                errors.add("${relative}: bypasses DiagnosticSink")
            }
            if (text.contains('catch (Throwable')) {
                errors.add("${relative}: catches fatal Throwable")
            }
            boolean diagnosticsAdapter = relative.startsWith('diagnostics/src/main/java/')
            boolean modHostAdapter = text.contains('new Slf4jDiagnosticSink') ||
                    text.contains('LoggerFactory')
            boolean pluginHostAdapter = relative.endsWith('NclSkinsBukkitPlugin.java') ||
                    relative.endsWith('NclSkinsBungeePlugin.java') ||
                    relative.endsWith('NclSkinsVelocityPlugin.java')
            if ((text.contains('import org.slf4j.') || text.contains('import java.util.logging.')) &&
                    !(diagnosticsAdapter || modHostAdapter || pluginHostAdapter ||
                            relative.endsWith('BukkitNativeAdapter.java') ||
                            relative.endsWith('AbstractBukkitNativeAdapter.java') ||
                            relative.contains('server-plugin-adapters/'))) {
                errors.add("${relative}: uses a logging API outside a host adapter")
            }
        }
        if (errors) throw new GradleException(errors.collect { "- ${it}" }.join('\n'))
        logger.lifecycle("Verified logging conventions across ${productionSources.files.size()} production sources")
    }
}

tasks.register('verifyLoggingSecurityBaseline') {
    group = 'verification'
    description = 'Requires a dated host-owned logging security baseline for every catalog Minecraft pin.'
    def baselineFile = file('gradle/logging-security-baseline.json')
    def requiredVersions = targetCatalog.targets.collect {
        it.minecraft.version.toString()
    }.toSet()
    inputs.file(baselineFile)
    inputs.file(layout.projectDirectory.file('gradle/targets.json'))
    doLast {
        Map baseline = new groovy.json.JsonSlurper().parse(
                baselineFile) as Map
        Set<String> versions = requiredVersions
        Set<String> covered = (baseline.minecraft as Map).keySet() as Set
        if (baseline.schemaVersion != 1 || !(baseline.checkedOn ==~ /20[0-9]{2}-[0-9]{2}-[0-9]{2}/) ||
                !covered.containsAll(versions) ||
                versions.any { (baseline.minecraft[it] as Map).ownership != 'host' }) {
            throw new GradleException('Logging security baseline does not cover every catalog pin')
        }
        logger.lifecycle("Verified host logging security baseline dated ${baseline.checkedOn}")
    }
}

