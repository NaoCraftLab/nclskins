plugins {
    id 'java-library'
}

def packaging = rootProject.extensions.extraProperties
        .get('nclskinsTargetCatalog').serverPlugin.packaging

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    api project(':server-plugin-common')
    implementation project(':server-configuration')
    implementation project(':server-runtime')
    implementation project(':server-vanilla-publication')
    compileOnly "io.papermc.paper:paper-api:${packaging.paperApi}"
    compileOnly 'org.apache.logging.log4j:log4j-api:2.19.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.java.srcDirs += [
    rootProject.file('server-plugin-adapters/legacy-authlib4/src/main/java'),
    rootProject.file('server-plugin-adapters/paper-authlib4/src/main/java'),
    rootProject.file('server-plugin-adapters/paper-authlib6/src/main/java'),
    rootProject.file('server-plugin-adapters/paper-authlib7/src/main/java'),
    rootProject.file('server-plugin-adapters/paper-authlib9/src/main/java')
]
