plugins {
    id 'groovy-gradle-plugin'
}

def buildLogicWorkspace = providers.gradleProperty('nclskinsBuildLogicWorkspace').orNull
if (buildLogicWorkspace != null) {
    if (!(buildLogicWorkspace ==~ /[a-z0-9][a-z0-9.-]*/)) {
        throw new GradleException(
                "nclskinsBuildLogicWorkspace must be a safe target ID, got '${buildLogicWorkspace}'")
    }
    layout.buildDirectory.set(layout.projectDirectory.dir("build/workspaces/${buildLogicWorkspace}"))
}

group = 'com.naocraftlab.skins.build'

repositories {
    mavenCentral()
}

gradlePlugin {
    plugins {
        tooling {
            id = 'com.naocraftlab.skins.build-tools'
            implementationClass = 'com.naocraftlab.skins.buildlogic.NclSkinsBuildToolsPlugin'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'junit.platform.stacktrace.pruning.enabled', 'false'
    testLogging {
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
        stackTraceFilters = []
    }
    inputs.files(
            file('../../gradle/version.properties'),
            file('../../gradle/plugin-version.properties'),
            file('../../gradle/targets.json'),
            file('../../build.gradle'),
            file('../../CHANGELOG.md'),
            file('../../PLUGIN_CHANGELOG.md'),
            file('../../.github/workflows/release.yml'),
            file('../../.github/workflows/release-candidate.yml'),
            file('../../.github/workflows/publish-update-catalog.yml'))
            .withPropertyName('rootReleaseFiles')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

dependencies {
    implementation 'org.ow2.asm:asm:9.9'
    implementation 'org.ow2.asm:asm-tree:9.9'
    testImplementation gradleTestKit()
    testImplementation 'org.ow2.asm:asm-commons:9.9'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
