if (targetSpec.loader.id != 'fabric') {
    throw new GradleException("Fabric conventions cannot configure ${targetSpec.loader.id}")
}

def parchmentVersion = nclskinsCatalogTools.parchmentVersion(targetCatalog, targetSpec)
def parchmentArtifactUrl = nclskinsCatalogTools.parchmentArtifactUrl(targetCatalog, targetSpec)

repositories {
    maven {
        name = 'Covers1624Maven'
        url = 'https://maven.covers1624.net/'
        content { includeGroup 'net.covers1624' }
    }
    if (parchmentVersion != null) {
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
            content {
                includeGroup 'org.parchmentmc.data'
            }
        }
    }
    maven {
        name = 'QuiltMaven'
        url = 'https://maven.quiltmc.org/repository/release'
        content {
            includeGroup 'org.quiltmc.parsers'
        }
    }
    maven {
        name = 'XanderMaven'
        url = 'https://maven.isxander.dev/releases'
        content {
            includeGroup 'dev.isxander'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

def dependencyConfiguration = project.ext.has('nclskinsFabricDependencyConfiguration')
    ? project.ext.nclskinsFabricDependencyConfiguration.toString()
    : 'modImplementation'
def modMenuConfiguration = configurations.findByName('modLocalRuntime') != null
        ? 'modLocalRuntime'
        : configurations.findByName('localRuntime') != null
        ? 'localRuntime'
        : null
if (modMenuConfiguration == null) {
    throw new GradleException('Fabric Loom does not provide a local runtime dependency scope')
}
def yaclVersion = nclskinsCatalogTools.optionalDependencyVersion(
        targetCatalog, targetSpec, 'yet_another_config_lib_v3')
def clientCompileOnlyConfiguration = configurations.findByName('modCompileOnly') != null
        ? 'modCompileOnly'
        : 'compileOnly'
def devLoginConfiguration = configurations.findByName('localRuntime') != null
        ? 'localRuntime'
        : 'runtimeOnly'
def licensedClientProfile = nclskinsCatalogTools.licensedClientProfile(
        targetCatalog, targetSpec.loader.id)
def licensedClientStorage = new File(
        System.getProperty('user.home'), ".devlogin/${licensedClientProfile}").absolutePath

loom {
    accessWidenerPath = nclskinsAccessFile
    runs {
        client {
            nclskinsCatalogTools.clientArguments(targetCatalog).each { argument ->
                programArg argument
            }
        }
        clientLicensed {
            client()
            mainClass.set('net.covers1624.devlogin.DevLogin')
            property 'devlogin.launch_target',
                    'net.fabricmc.loader.impl.launch.knot.KnotClient'
            property 'devlogin.launch_profile', licensedClientProfile
            property 'devlogin.storage', licensedClientStorage
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${nclskinsCatalogTools.minecraftCompileVersion(targetSpec)}"
    if (dependencyConfiguration == 'modImplementation') {
        if (parchmentVersion == null) {
            throw new GradleException(
                "Missing Parchment mappings for mapped Fabric target ${targetSpec.id}")
        }
        mappings loom.layered() {
            officialMojangMappings()
            parchment(parchmentArtifactUrl)
        }
    } else if (dependencyConfiguration != 'implementation') {
        throw new GradleException(
            "Unsupported Fabric dependency configuration: ${dependencyConfiguration}")
    }
    add(
        dependencyConfiguration,
        "net.fabricmc:fabric-loader:${targetSpec.loader.version}")
    add(
        dependencyConfiguration,
        "net.fabricmc.fabric-api:fabric-api:${targetSpec.loader.apiVersion}")
    add(
            modMenuConfiguration,
            "maven.modrinth:modmenu:${targetSpec.loader.modMenuVersion}")
    add(
            clientCompileOnlyConfiguration,
            "maven.modrinth:modmenu:${targetSpec.loader.modMenuVersion}")
    add(clientCompileOnlyConfiguration, "dev.isxander:yet-another-config-lib:${yaclVersion}")
    add(modMenuConfiguration, "dev.isxander:yet-another-config-lib:${yaclVersion}")
    add(devLoginConfiguration, "net.covers1624:DevLogin:${targetCatalog.plugins.devLogin}")
}
