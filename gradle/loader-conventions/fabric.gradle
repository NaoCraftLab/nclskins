if (targetSpec.loader.id != 'fabric') {
    throw new GradleException("Fabric conventions cannot configure ${targetSpec.loader.id}")
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

def dependencyConfiguration = project.ext.has('nclskinsFabricDependencyConfiguration')
    ? project.ext.nclskinsFabricDependencyConfiguration.toString()
    : 'modImplementation'
def modMenuConfiguration = configurations.findByName('modLocalRuntime') != null
        ? 'modLocalRuntime'
        : configurations.findByName('localRuntime') != null
        ? 'localRuntime'
        : null
if (modMenuConfiguration == null) {
    throw new GradleException('Fabric Loom does not provide a local runtime dependency scope')
}

loom {
    accessWidenerPath = file('src/main/resources/nclskins.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${targetSpec.minecraft.version}"
    if (dependencyConfiguration == 'modImplementation') {
        mappings loom.officialMojangMappings()
    } else if (dependencyConfiguration != 'implementation') {
        throw new GradleException(
            "Unsupported Fabric dependency configuration: ${dependencyConfiguration}")
    }
    add(
        dependencyConfiguration,
        "net.fabricmc:fabric-loader:${targetSpec.loader.version}")
    add(
        dependencyConfiguration,
        "net.fabricmc.fabric-api:fabric-api:${targetSpec.loader.apiVersion}")
    add(
            modMenuConfiguration,
            "maven.modrinth:modmenu:${targetSpec.loader.modMenuVersion}")
}
