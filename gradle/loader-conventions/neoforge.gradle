if (targetSpec.loader.id != 'neoforge') {
    throw new GradleException("NeoForge conventions cannot configure ${targetSpec.loader.id}")
}

repositories {
    maven {
        url = 'https://maven.quiltmc.org/repository/release'
        content { includeGroup 'org.quiltmc.parsers' }
    }
    maven {
        url = 'https://maven.isxander.dev/releases'
        content { includeGroup 'dev.isxander' }
    }
    maven {
        url = 'https://maven.fabricmc.net/'
        content { includeGroup 'net.fabricmc.fabric-api' }
    }
}

def yaclVersion = nclskinsCatalogTools.optionalDependencyVersion(
        targetCatalog, targetSpec, 'yet_another_config_lib_v3')
def yaclDevelopmentRuntimeEnabled = nclskinsCatalogTools.optionalDependencyDevelopmentRuntimeEnabled(
        targetCatalog, targetSpec, 'yet_another_config_lib_v3')
def parchmentVersion = nclskinsCatalogTools.parchmentVersion(targetCatalog, targetSpec)
def parchmentArtifactVersion =
        nclskinsCatalogTools.parchmentArtifactVersion(targetCatalog, targetSpec)
def yaclRuntimeConfiguration = configurations.findByName('localRuntime') != null
        ? 'localRuntime'
        : 'runtimeOnly'
def yaclCoordinate = "dev.isxander:yet-another-config-lib:${yaclVersion}"
def yaclRuntimeGraph = yaclDevelopmentRuntimeEnabled
        ? configurations.detachedConfiguration(dependencies.create(yaclCoordinate))
        : null
if (yaclRuntimeGraph != null) {
    yaclRuntimeGraph.transitive = false
}
def patchYaclRuntimeMetadataTaskType = nclskinsCatalogTools.getClassLoader().loadClass(
        'com.naocraftlab.skins.buildlogic.PatchNeoForgeRuntimeMetadataTask')
def patchedYaclRuntime = yaclDevelopmentRuntimeEnabled && targetSpec.minecraft.version == '26.2'
        ? tasks.register('patchYaclRuntimeMetadata',
        patchYaclRuntimeMetadataTaskType) {
            artifactKind.set('yacl')
            inputArtifact.set(layout.file(providers.provider {
                yaclRuntimeGraph.singleFile
            }))
            outputArtifact.set(nclskinsClientRuntimeDirectory.file(
                    "yacl-${yaclVersion}-icon-metadata.jar"))
        }
        : null
def neoForgeRepositoryRoot = project.layout.projectDirectory.dir('../../..').asFile
def licensedClientProfile = nclskinsCatalogTools.licensedClientProfile(
        targetCatalog, targetSpec.loader.id)
def licensedClientStorage = new File(
        System.getProperty('user.home'), ".devlogin/${licensedClientProfile}").absolutePath
def neoForgeClientRun = nclskinsRunLayout.modDirectory(neoForgeRepositoryRoot, targetSpec, 'Client')
def neoForgeLicensedClientRun = nclskinsRunLayout.modDirectory(
        neoForgeRepositoryRoot, targetSpec, 'LicensedClient')
def neoForgeServerRun = nclskinsRunLayout.modDirectory(neoForgeRepositoryRoot, targetSpec, 'Server')

dependencies {
    compileOnly(yaclCoordinate) {
        transitive = yaclDevelopmentRuntimeEnabled
    }
    if (patchedYaclRuntime != null) {
        add(yaclRuntimeConfiguration, files(patchedYaclRuntime))
    } else if (yaclDevelopmentRuntimeEnabled) {
        add(yaclRuntimeConfiguration, yaclCoordinate)
    }
}

def serverPort = providers.gradleProperty('nclskinsServerPort')

neoForge {
    if (parchmentVersion != null) {
        parchment {
            parchmentArtifact = "org.parchmentmc.data:" +
                    "parchment-${targetSpec.minecraft.version}:${parchmentArtifactVersion}@zip"
        }
    }

    accessTransformers.from(nclskinsAccessFile)

    runs {
        configureEach {
            if (providers.gradleProperty('nclskinsDevLogging')
                    .map { it == 'true' }.getOrElse(false)) {
                logLevel = org.slf4j.event.Level.DEBUG
                systemProperty 'forge.logging.console.level', 'debug'
                systemProperty 'forge.logging.file.level', 'debug'
            }
        }
        client {
            client()
            gameDirectory = neoForgeClientRun
            nclskinsCatalogTools.clientArguments(targetCatalog).each { argument ->
                programArgument argument
            }
        }
        clientLicensed {
            client()
            gameDirectory = neoForgeLicensedClientRun
            devLogin = true
            systemProperty 'devlogin.launch_profile', licensedClientProfile
            systemProperty 'devlogin.storage', licensedClientStorage
        }
        server {
            server()
            gameDirectory = neoForgeServerRun
            programArgument '--nogui'
            if (serverPort.isPresent()) {
                programArgument '--port'
                programArgument serverPort.get()
            }
        }
    }

    mods {
        nclskins {
            sourceSet sourceSets.main
        }
    }
}

ext.nclskinsFancyCompileConfiguration = 'compileOnly'
apply from: '../../../gradle/fancymenu-conventions.gradle'
ext.nclskinsCpmCompileConfiguration = 'compileOnly'
apply from: '../../../gradle/cpm-conventions.gradle'
if (targetSpec.capabilities.appearance in ['skin-lookup', 'cape-foil-pipeline-samplers', 'cape-foil-pipeline-target-state', 'cape-foil-pipeline-bind-groups', 'cape-foil-combined']
        && findProperty('nclskinsWaveyCompositionProfile') != 'isolated') {
    neoForge.runs.create('waveyVerification') {
        client()
        if (targetSpec.capabilities.appearance != 'skin-lookup') mainClass = 'com.naocraftlab.skins.buildlogic.boot.ClientCapeLauncher'
        gameDirectory = layout.buildDirectory.dir('verification/waveycapes-composition/runtime')
        disableIdeRun()
    }
}
if (targetSpec.capabilities.appearance == 'skin-lookup' && findProperty('nclskinsWaveyCompositionProfile') != 'isolated') {
    tasks.register('prepareWaveyLegacyProvider') {
        dependsOn tasks.named('prepareWaveyVerificationRun')
        ext.vmArgsFile = layout.buildDirectory.file('verification/wavey-provider/vm.json')
        ext.programArgsFile = layout.buildDirectory.file('verification/wavey-provider/provider.json')
        outputs.files(vmArgsFile, programArgsFile)
        doLast {
            def t = tasks.named('runWaveyVerification').get()
            Map inputs = [mainClass: t.mainClass.get(), classpath: t.classpathProvider.files.collect { it.absolutePath },
                    jvmArgs: t.allJvmArgs + t.jvmArgumentProviders.collectMany { it.asArguments().toList() },
                    args: t.args + t.argumentProviders.collectMany { it.asArguments().toList() },
                    properties: t.systemProperties, environment: t.environmentProperty.get()]
            Map safe = nclskinsCatalogTools.classLoader.loadClass('com.naocraftlab.skins.buildlogic.WaveyLegacyComposition').safeProvider(inputs)
            File output = programArgsFile.get().asFile; output.parentFile.mkdirs()
            output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(safe))
            vmArgsFile.get().asFile.text = groovy.json.JsonOutput.toJson(safe.jvmArgs)
        }
    }
}
apply from: '../../../gradle/waveycapes-conventions.gradle'
