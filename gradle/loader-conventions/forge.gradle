import groovy.json.JsonOutput
import groovy.json.JsonSlurper

if (targetSpec.loader.id != 'forge') {
    throw new GradleException("Forge conventions cannot configure ${targetSpec.loader.id}")
}

def parchmentVersion = nclskinsCatalogTools.parchmentVersion(targetCatalog, targetSpec)
if (parchmentVersion == null) {
    throw new GradleException("Missing Parchment mappings for Forge target ${targetSpec.id}")
}
def forgeParchmentVersion = "${parchmentVersion}-${targetSpec.minecraft.version}"

def forgeMixinConfigs = targetSpec.metadata.serverMixins + targetSpec.metadata.mixins
def mixinExtrasVersion = targetCatalog.plugins.mixinExtras.toString()
def forgePrimaryMixinConfig = targetSpec.metadata.mixins.find {
    it.toString().endsWith('.mixins.json')
}
if (forgePrimaryMixinConfig == null) {
    throw new GradleException("Forge target ${targetSpec.id} requires a client Mixin config")
}
def forgeMixinRefmap = forgePrimaryMixinConfig.toString().replace('.mixins.json', '.refmap.json')
def forgeCompileJava = tasks.named(sourceSets.main.compileJavaTaskName, JavaCompile)
def forgeMixinRefmapFile = forgeCompileJava.map {
    new File(it.temporaryDir, forgeMixinRefmap)
}

repositories {
    maven {
        name = 'Covers1624Maven'
        url = 'https://maven.covers1624.net/'
        content { includeGroup 'net.covers1624' }
    }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven {
        url = 'https://maven.quiltmc.org/repository/release'
        content { includeGroup 'org.quiltmc.parsers' }
    }
    maven {
        url = 'https://maven.isxander.dev/releases'
        content { includeGroup 'dev.isxander' }
    }
}

def yaclVersion = nclskinsCatalogTools.optionalDependencyVersion(
        targetCatalog, targetSpec, 'yet_another_config_lib_v3')
def licensedClientProfile = nclskinsCatalogTools.licensedClientProfile(
        targetCatalog, targetSpec.loader.id)
def licensedClientStorage = new File(
        System.getProperty('user.home'), ".devlogin/${licensedClientProfile}").absolutePath
def forgeRepositoryRoot = project.layout.projectDirectory.dir('../../..').asFile
def forgeClientRun = nclskinsRunLayout.modDirectory(forgeRepositoryRoot, targetSpec, 'Client')
def forgeLicensedClientRun = nclskinsRunLayout.modDirectory(
        forgeRepositoryRoot, targetSpec, 'LicensedClient')
def forgeServerRun = nclskinsRunLayout.modDirectory(forgeRepositoryRoot, targetSpec, 'Server')

mixin {
    add sourceSets.main, forgeMixinRefmap
    quiet()
}

jarJar.enable()

forgeCompileJava.configure {
    inputs.property('nclskinsMixinRefmap', forgeMixinRefmap)
    outputs.file(new File(temporaryDir, forgeMixinRefmap))
    outputs.file(new File(temporaryDir, "${name}-mappings.tsrg"))
}

def forgeMixinRuntime = sourceSets.create('forgeMixinRuntime') {
    java.setSrcDirs([])
    resources.setSrcDirs([])
    resources.srcDir(forgeCompileJava.map { it.temporaryDir })
}

tasks.named(forgeMixinRuntime.processResourcesTaskName, ProcessResources).configure {
    dependsOn forgeCompileJava
    inputs.file(forgeMixinRefmapFile)
    include forgeMixinRefmap
}

minecraft {
    mappings channel: 'parchment',
        version: forgeParchmentVersion
    copyIdeResources = true
    accessTransformer = nclskinsAccessFile

    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            if (providers.gradleProperty('nclskinsDevLogging')
                    .map { it == 'true' }.getOrElse(false)) {
                property 'forge.logging.console.level', 'debug'
                property 'forge.logging.file.level', 'debug'
                property 'forge.logging.debugFile.level', 'debug'
            } else {
                property 'forge.logging.console.level', 'info'
            }
            (targetSpec.metadata.serverMixins + targetSpec.metadata.mixins).each { configName ->
                args '--mixin.config', configName.toString()
            }
            mods {
                nclskins {
                    source sourceSets.main
                    source forgeMixinRuntime
                }
            }
        }

        client {
            workingDirectory forgeClientRun
        }
        clientLicensed {
            parent minecraft.runs.client
            workingDirectory forgeLicensedClientRun
            main 'net.covers1624.devlogin.DevLogin'
            property 'devlogin.launch_target', 'cpw.mods.bootstraplauncher.BootstrapLauncher'
            property 'devlogin.launch_profile', licensedClientProfile
            property 'devlogin.storage', licensedClientStorage
        }
        server {
            workingDirectory forgeServerRun
            args '--nogui'
        }
    }
}

tasks.configureEach { candidate ->
    if (candidate.name == 'runClient') {
        candidate.args nclskinsCatalogTools.clientArguments(targetCatalog)
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${targetSpec.minecraft.version}-${targetSpec.loader.version}"
    compileOnly fg.deobf("dev.isxander:yet-another-config-lib:${yaclVersion}")
    runtimeOnly fg.deobf("dev.isxander:yet-another-config-lib:${yaclVersion}")
    runtimeOnly "net.covers1624:DevLogin:${targetCatalog.plugins.devLogin}"
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinExtrasVersion}"
    annotationProcessor(
        "org.spongepowered:mixin:${targetCatalog.plugins.mixinProcessor}:processor")
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinExtrasVersion}"
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinExtrasVersion}")) {
        jarJar.ranged(it, "[${mixinExtrasVersion},0.6)")
    }
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property('nclskinsForgeMixinRefmap', forgeMixinRefmap)
    doLast {
        forgeMixinConfigs.each { configName ->
            def configFile = new File(destinationDir, configName.toString())
            if (!configFile.isFile()) {
                throw new GradleException("Missing processed Mixin config ${configName}")
            }
            def config = new JsonSlurper().parse(configFile)
            if (config.containsKey('refmap') && config.refmap != forgeMixinRefmap) {
                throw new GradleException(
                    "Mixin config ${configName} declares unexpected refmap ${config.refmap}")
            }
            config.refmap = forgeMixinRefmap
            configFile.setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(config)) + System.lineSeparator(),
                'UTF-8')
        }
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = targetSpec.artifact.file.toString()
            .replace('{modVersion}', project.version.toString())
            .replace('.jar', '-dev.jar')
    manifest.attributes(
        'Specification-Title': 'NCL Skins',
        'Specification-Vendor': 'NaoCraftLab',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Implementation-Vendor': 'NaoCraftLab'
    )
}

reobf {
    jarJar {}
}

tasks.named('jarJar', Jar).configure {
    archiveFileName = targetSpec.artifact.file.toString()
            .replace('{modVersion}', project.version.toString())
    finalizedBy tasks.named('reobfJarJar')
}
